# tribunal/cloudbuild.test.yaml — Tribunal test-suite gate (Phase 13 re-home).
#
# Runs `pytest nestor_pulse_sdk/tests/` against a REAL Postgres so the re-homed engine
# (audit chain, RLS isolation, the per-run advisory-lock exactly-once test from Plan 02)
# is proven on the intake infra. A non-zero pytest exit FAILS the build — the merge/deploy
# gate. Mirrors this repo's cloudbuild.test.yaml pattern (real Postgres + pytest gate,
# CLOUD_LOGGING_ONLY, 1200s), adapted to the Tribunal suite.
#
# WHY the Docker socket (not a fixed DATABASE_URL like the intake gate): the Tribunal suite
# is testcontainers-based (conftest.py::postgres_container spins up `postgres:15` via
# `testcontainers[postgresql]==4.14.2`, pinned in requirements.txt). Rather than modify the
# copied conftest (the engine tree is carried byte-identical — ENGINE-04 integrity), we give
# the test step access to the Cloud Build Docker daemon by mounting the host socket, so
# testcontainers can start its own ephemeral Postgres exactly as it does on a dev box with
# Docker. The pgvector image is pulled up front so the suite's container start is fast.
#
# NO NEW PACKAGES (T-13-SC): deps are installed from the verbatim-carried tribunal/requirements.txt
# (Plan 01 audit — no new package selected). pytest / pytest-asyncio / testcontainers are all
# already pinned there.
#
# INVOCATION (Cloud Shell; run BEFORE deploying, per § Phase 13 of infra/DEPLOY-RUNBOOK.md):
#   gcloud builds submit tribunal \
#     --config=tribunal/cloudbuild.test.yaml \
#     --project="$GOOGLE_PROJECT"

# ---------------------------------------------------------------------------
# KNOWN LIMITATION (measured 2026-07-26, phase 15.2) — the 42 skips are REAL.
#
# The testcontainers fixture does NOT start in this config. Diagnosed skip
# reason, straight from pytest -rs:
#     Docker not available for testcontainers:
#     "host" network_mode is incompatible with port_bindings
# testcontainers 4.x asks docker for port bindings on the Postgres container it
# spawns, and docker rejects that under the --network=host mode this step needs
# (see the WHY block below). So `postgres_container` skips, and every test
# depending on it skips with it. The build still exits 0 -> a green "full
# suite" that silently proves nothing about the DB-backed paths.
#
# A related typo was fixed the same day (requirements.txt pinned
# `testcontainers[postgresql]`; 4.14.2's real extra is `postgres`). That was a
# genuine defect and is corrected, but it was NOT the cause -- the postgres
# module now imports cleanly and the skips persist for the reason above.
#
# DO NOT "fix" this by chasing testcontainers networking. Two reasons:
#   1. This repo already has a working real-Postgres pattern that needs no
#      testcontainers at all: `docker run -d --name pg --network=host
#      postgres:15` plus a DATABASE_URL handed to pytest. See
#      cloudbuild.test-critical.yaml and cloudbuild.test-rls.yaml.
#   2. testcontainers' Postgres runs as SUPERUSER, and RLS never applies to
#      superusers. Any cross-tenant / RLS denial test written against this
#      fixture would be VACUOUS even if the fixture started -- exactly the bug
#      plan 15.2-01 found in test_rls_isolation.py, where four pre-existing
#      denial tests had never once executed under a role RLS binds to.
#
# THEREFORE: DB-backed tenant-isolation tests belong in cloudbuild.test-rls.yaml
# (non-superuser app_user DSN). Other DB-backed tests belong in
# cloudbuild.test-critical.yaml. Treat this suite's skips as NOT-PROVEN, never
# as passes -- 15.2-VALIDATION.md states this as a hard rule.
# ---------------------------------------------------------------------------

steps:
  # Run pytest inside a --network=host container on the shared Cloud Build daemon.
  # WHY host networking (proven live 2026-07-20, build 4th iteration):
  #   - An explicit /var/run/docker.sock volume is REJECTED by Cloud Build (reserved path);
  #     mounting it via `docker run -v` from the docker builder works.
  #   - testcontainers publishes its ephemeral Postgres port on the DAEMON HOST; a normal
  #     build step is itself a container, so localhost:mapped-port is unreachable there
  #     (gateway-IP + TESTCONTAINERS_HOST_OVERRIDE gets connection-refused too).
  #     --network=host makes localhost resolve on the daemon host where the port publishes.
  - id: pytest-hostnet
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull -q postgres:15
        docker run --rm --network=host \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v /workspace:/workspace -w /workspace \
          -e TESTCONTAINERS_RYUK_DISABLED=true \
          python:3.11-slim bash -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io >/dev/null && pip install --no-cache-dir -q -r requirements.txt && python -m pytest nestor_pulse_sdk/tests/ -q"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Full suite incl. testcontainers spin-up + pip install needs headroom (first run timed
# out at 1200s at ~62%). NOTE: some tests require live provider API keys and will fail in
# this keyless build environment — triage deferred (see 13-PROOF-RESULTS.md); the
# phase-critical subset (schema isolation, advisory lock, hash chain, RLS) is green.
timeout: "3600s"
