# tribunal/cloudbuild.test-engine.yaml — Phase 15.2 research-engine test gate.
#
# The FAST phase gate for 15.2, and the analogue of cloudbuild.test-gates.yaml
# (which remains the 15.1 verification-gate regression gate). This config
# provisions NO DATABASE and requires NO PROVIDER API KEYS: every file listed
# below is pure — reliability primitives are clock-injectable and I/O-free, LLM
# egress in the engine tests goes through hand-written duck-typed fakes, and
# nothing opens a connection. So the whole Postgres preamble of
# cloudbuild.test-critical.yaml (image pull, container start, pg_isready wait,
# role creation) and its connection-string env are deliberately absent here.
#
# The `not live` marker filter on the pytest line is LOAD-BEARING. pyproject.toml
# only REGISTERS the `live` marker — it is listed under
# [tool.pytest.ini_options] markers so that --strict-markers accepts it — and
# registration does NOT deselect it. Without that filter a live-marked test
# would fire a REAL LLM call from CI, against an Anthropic account that is
# already at its monthly cap (resets 2026-08-01). Every provider-touching test
# in this phase carries @pytest.mark.live precisely because this filter exists.
#
# The file list is built with `ls ... 2>/dev/null || true` because this config
# lands in wave 1 while its target test files arrive across waves 1-10: a file
# that does not exist yet must be a SKIP, not a pytest collection error. The
# `|| true` is required — under `set -e` a bare `FILES=$(ls missing-file)`
# aborts the script. Do not tidy that guard away, and do not replace the
# explicit list with a glob: the explicit list is what keeps unrelated suite
# files (and every DB-bound file) out of this fast gate.
#
# READ THE `collecting:` BLOCK, NOT JUST THE EXIT STATUS. The same `|| true`
# guard that tolerates a not-yet-written file also silently drops a MISNAMED
# one — a typo'd path makes this gate go green having run nothing.
#
# OWNERSHIP: this file was owned EXCLUSIVELY by plan 15.2-02 for the main phase.
# Ownership passed to plan 15.2-20 for the GAP PHASE (plans 15.2-20…26), which
# is the wave-1 plan and therefore adds all five gap-phase filenames in one edit;
# NO OTHER GAP PLAN EDITS THIS FILE. Every planned 15.2 test file is listed, so a
# later wave adds its file to the repo and this gate picks it up with no config
# change.
# Any file listed here must be pure (no Postgres, no provider key, no network)
# OR must pytest.skip() cleanly when DATABASE_URL is unset (the
# test_rls_isolation.py::_require_database_url() pattern) — it must never error
# at import or at collection time.
#
# INVOCATION:
#   gcloud builds submit tribunal \
#     --config=tribunal/cloudbuild.test-engine.yaml \
#     --project="$GOOGLE_PROJECT"

steps:
  - id: pytest-engine
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        docker run --rm \
          -v /workspace:/workspace -w /workspace \
          python:3.11-slim bash -c '
            set -e
            pip install --no-cache-dir -q -r requirements.txt
            # 27 paths: the 19 NEW 15.2 files (waves 1-11), plus the 3 EXISTING
            # pure files that 15.2 extends and that cloudbuild.test-gates.yaml
            # does not already run, plus the 5 GAP-PHASE files (15.2-20…24)
            # added by plan 15.2-20 — four of which do not exist yet; see the
            # block below, which says out loud what that costs.
            #
            # TWO DELIBERATE EXCLUSIONS, both intentional, neither an oversight:
            #  (1) test_rls_isolation.py, test_citation_roundtrip.py and
            #      test_citation_numbering.py need a REAL Postgres, so they
            #      belong to cloudbuild.test-critical.yaml (and, for the
            #      non-superuser DSN, cloudbuild.test-rls.yaml from plan 15.2-01).
            #  (2) test_gate_replay.py, test_verification_buckets.py,
            #      test_fail_loud.py, test_tribunal_grouping.py,
            #      test_claim_distiller.py and test_stage_schema.py are ALREADY
            #      run by cloudbuild.test-gates.yaml, which the 15.2 sampling
            #      rate runs alongside this gate at every wave merge — listing
            #      them twice would only slow the gate down.
            #
            # THE FIVE GAP-PHASE FILES (the last five entries below) ARE ADDED
            # ALL AT ONCE BY PLAN 15.2-20, AND FOUR OF THEM DO NOT EXIST YET.
            # Say the trap out loud, because this repository has a documented
            # history of gates that were green because they ran nothing: the
            # `ls … || true` idiom above SILENTLY SKIPS a name whose file is
            # absent, so between waves those four names collect as nothing and
            # this gate stays green having proven nothing about them. The
            # arrangement is deliberate — one owner for this config, no plan left
            # with an ungated test — and it is only honest if each part is done:
            #   * each owning plan proves ITS OWN file is BOTH collected (read
            #     the `collecting:` block) AND green;
            #   * plan 15.2-26 RECONCILES the final collected count before the
            #     phase closes, so a MISTYPED name cannot survive.
            #
            # NEVER put an apostrophe anywhere in this block — not even inside a
            # comment, and not to quote this rule. The whole script below is
            # passed to bash as ONE single-quoted -c argument, so any single
            # quote CLOSES that string and the remainder is reparsed by the outer
            # shell. The symptom is bewildering: a bare
            # "python: command not found" long AFTER pip has succeeded. Cost one
            # red build on 2026-07-27.
            #     15.2-20 -> test_stale_reclaim.py   (D-E stale reclaim)
            #     15.2-21 -> test_brief_input.py
            #     15.2-22 -> test_web_fetch_replay.py
            #     15.2-23 -> test_dispatch_pii.py
            #     15.2-24 -> test_stage_logging.py
            #
            # test_stale_reclaim.py is DB-BOUND and therefore SKIPS in THIS gate,
            # which provisions no Postgres. That is contract-compliant (see the
            # header: a listed file may skip cleanly when DATABASE_URL is unset)
            # and it is NOT a pass. What this gate proves for that file is that it
            # imports, collects and does not error; the harness that RUNS it is
            # cloudbuild.test-critical.yaml, whose DSN is a superuser on a
            # disposable schema. Read the `-rs` skip summary, not the exit status.
            FILES=$$(ls nestor_pulse_sdk/tests/test_reliability_retry.py \
                        nestor_pulse_sdk/tests/test_reliability_breaker.py \
                        nestor_pulse_sdk/tests/test_terminal_states.py \
                        nestor_pulse_sdk/tests/test_feed_enrichment.py \
                        nestor_pulse_sdk/tests/test_fact_list_parser.py \
                        nestor_pulse_sdk/tests/test_citation_anchors.py \
                        nestor_pulse_sdk/tests/test_report_sections.py \
                        nestor_pulse_sdk/tests/test_status_gates.py \
                        nestor_pulse_sdk/tests/test_coverage_reentry.py \
                        nestor_pulse_sdk/tests/test_workshop_critique.py \
                        nestor_pulse_sdk/tests/test_workshop_scope_guard.py \
                        nestor_pulse_sdk/tests/test_workshop_tournament.py \
                        nestor_pulse_sdk/tests/test_workshop_languages.py \
                        nestor_pulse_sdk/tests/test_own_researcher.py \
                        nestor_pulse_sdk/tests/test_cost_serpapi.py \
                        nestor_pulse_sdk/tests/test_factlist_fallback.py \
                        nestor_pulse_sdk/tests/test_checkpoint_resume.py \
                        nestor_pulse_sdk/tests/test_provider_resume.py \
                        nestor_pulse_sdk/tests/test_engine_e2e_stubbed.py \
                        nestor_pulse_sdk/tests/test_research_division_assignment.py \
                        nestor_pulse_sdk/tests/test_distiller_coverage.py \
                        nestor_pulse_sdk/tests/test_hash_chain_replay.py \
                        nestor_pulse_sdk/tests/test_stale_reclaim.py \
                        nestor_pulse_sdk/tests/test_brief_input.py \
                        nestor_pulse_sdk/tests/test_web_fetch_replay.py \
                        nestor_pulse_sdk/tests/test_dispatch_pii.py \
                        nestor_pulse_sdk/tests/test_stage_logging.py 2>/dev/null || true)
            if [ -z "$$FILES" ]; then
              echo "no 15.2 engine test files present yet — nothing to run"
              exit 0
            fi
            echo "collecting:"
            echo "$$FILES"
            python -m pytest $$FILES -v -rs --tb=short -m "not live"
          '
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: "1800s"
