# tribunal/cloudbuild.test-engine.yaml — Phase 15.2 research-engine test gate.
#
# The FAST phase gate for 15.2, and the analogue of cloudbuild.test-gates.yaml
# (which remains the 15.1 verification-gate regression gate). This config
# provisions NO DATABASE and requires NO PROVIDER API KEYS: every file listed
# below is pure — reliability primitives are clock-injectable and I/O-free, LLM
# egress in the engine tests goes through hand-written duck-typed fakes, and
# nothing opens a connection. So the whole Postgres preamble of
# cloudbuild.test-critical.yaml (image pull, container start, pg_isready wait,
# role creation) and its connection-string env are deliberately absent here.
#
# The `not live` marker filter on the pytest line is LOAD-BEARING. pyproject.toml
# only REGISTERS the `live` marker — it is listed under
# [tool.pytest.ini_options] markers so that --strict-markers accepts it — and
# registration does NOT deselect it. Without that filter a live-marked test
# would fire a REAL LLM call from CI, against an Anthropic account that is
# already at its monthly cap (resets 2026-08-01). Every provider-touching test
# in this phase carries @pytest.mark.live precisely because this filter exists.
#
# The file list is built with `ls ... 2>/dev/null || true` because this config
# landed in wave 1 while its target test files arrived across waves 1-10: a file
# that did not exist yet had to be a SKIP, not a pytest collection error. The
# `|| true` is required — under `set -e` a bare `FILES=$(ls missing-file)`
# aborts the script. Do not tidy that guard away, and do not replace the
# explicit list with a glob: the explicit list is what keeps unrelated suite
# files (and every DB-bound file) out of this fast gate.
#
# THAT ARRANGEMENT IS NOW CLOSED (plan 15.2-26, 2026-07-27). Every named file
# exists, so the config ASSERTS ITS OWN COMPLETENESS: `EXPECTED_FILES` pins how
# many paths the list names, the script counts what `ls` actually collected, and
# a mismatch FAILS THE BUILD naming the absent or mistyped path.
#
# BOTH HALVES ARE LOAD-BEARING AND REMOVING EITHER ONE LOOKS REASONABLE:
#   * the `|| true` prevents a COLLECTION ERROR (an aborted script tells you
#     nothing about the other 26 files);
#   * the count assertion is what converts the silent SKIP that `|| true`
#     permits into a RED build.
# Drop the `|| true` and a single missing file kills the script before pytest
# runs. Drop the assertion and a single mistyped path makes this gate go green
# having run 29 of 30 files while reporting nothing about the 30th.
#
# ⚠ THAT `29 of 30` IS EXEMPT FROM D-W5-15 — do not "helpfully" delete it, and
# do not "helpfully" update it to match the current EXPECTED_FILES either. It is
# ARITHMETIC DERIVED FROM THE ASSERTION (N named, one mistyped, N-1 collected),
# true by construction, illustrating the MECHANISM by which this guard fails. It
# is not a measurement of anything, so it cannot rot. Proof the distinction is
# the right one: EXPECTED_FILES has moved twice since that sentence was written
# and `29 of 30` has ALREADY drifted from the live count while misleading
# nobody. D-W5-15 governs MEASURED counts only — a grepped import count is a
# fact that rots and belongs in a dated SUMMARY, not in a comment.
# cloudbuild.test-gates.yaml carries `12 of 13` in the same sentence for the
# same reason.
#
# OWNERSHIP: this file was owned EXCLUSIVELY by plan 15.2-02 for the main phase.
# Ownership passed to plan 15.2-20 for the GAP PHASE (plans 15.2-20…26), which
# is the wave-1 plan and therefore adds all five gap-phase filenames in one edit;
# NO OTHER GAP PLAN EDITS THIS FILE. Every planned 15.2 test file is listed, so a
# later wave adds its file to the repo and this gate picks it up with no config
# change.
#
# PHASE 15.3 reuses this gate rather than adding a second engine config. Its
# wave-1 plan 15.3-01 owns the file for that phase and adds BOTH the path and
# the EXPECTED_FILES bump (27 -> 28) in ONE edit, for the reason stated above:
# the list and the number are one change, and splitting them is how a gate goes
# green having run less than it claims. Plan 15.3-02 follows the same rule for
# its own file (28 -> 29), and plan 15.3-03 for its own (29 -> 30) — the emit
# sites in pipeline.py and research_division.py.
# Unlike 15.2, no 15.3 name is added AHEAD of its file:
# each plan registers its test file in the same commit that creates it, so the
# `ls ... || true` silent-skip window never opens for this phase.
#
# PHASE 15.4 reuses this gate for the same reason 15.3 did. Its wave-1 plan
# 15.4-02 adds BOTH its path and the EXPECTED_FILES bump (30 -> 31) in ONE edit,
# and every later 15.4 plan that adds a test file does the same for its own
# file. The list and the number are one change. Splitting them is how a gate
# goes green having run less than it claims -- which is, in miniature, the
# exact class of silent failure phase 15.4 exists to repair.
# Any file listed here must be pure (no Postgres, no provider key, no network)
# OR must pytest.skip() cleanly when DATABASE_URL is unset (the
# test_rls_isolation.py::_require_database_url() pattern) — it must never error
# at import or at collection time.
#
# INVOCATION:
#   gcloud builds submit tribunal \
#     --config=tribunal/cloudbuild.test-engine.yaml \
#     --project="$GOOGLE_PROJECT"

# ---------------------------------------------------------------------------
# WHY THE FILE LIST LOOKS THE WAY IT DOES
#
# RELOCATED 2026-07-29 (plan 15.4-03 follow-up). This commentary used to live
# INSIDE the bash script below. It was moved out — verbatim, not summarised —
# because Cloud Build caps a single build-step arg at 10,000 characters and
# registering the 32nd test file pushed the script to 13,473, of which 9,416
# were these comments. `gcloud builds submit` then failed outright with
# `build step 0 arg 1 too long`, so the gate could not run at all.
#
# YAML comments are not part of the arg, so nothing here counts toward that
# limit. Not one word was deleted: this file has explicit instructions not to
# tidy its guards away, and the reasoning below is why the `|| true` and the
# count assertion are BOTH load-bearing. Deleting it to fit would have thrown
# away the knowledge instead of the bytes.
# ---------------------------------------------------------------------------
# 30 paths: the 19 NEW 15.2 files (waves 1-11), plus the 3 EXISTING
# pure files that 15.2 extends and that cloudbuild.test-gates.yaml
# does not already run, plus the 5 GAP-PHASE files (15.2-20…24)
# added by plan 15.2-20, plus the 3 PHASE-15.3 files added by plans
# 15.3-01, 15.3-02 and 15.3-03. ALL 30 NOW EXIST — the count is
# asserted below, so this number and the list must be changed
# together.
#
# THAT 30 IS THE 15.2 + 15.3 BASELINE AND IS DELIBERATELY LEFT AS
# HISTORY, not maintained: phase 15.4 adds on top of it (15.4-02
# -> 31, 15.4-03 -> 32), then 15.5-01 -> 33, 15.6-07 -> 35 (two
# files, one edit), 15.7 -> 36, and 15.8-13 -> 43 (seven files, one
# edit, one owner — see the PHASE 15.8 block further down).
# The ONE number that must track the list is
# EXPECTED_FILES below; every other count in these comments is a
# narrative of how the list was assembled. Corrected 2026-07-29 by
# plan 15.4-03, because a stale count inside the comments of the
# very config that exists to reconcile counts is exactly the kind
# of quietly-wrong number this phase was opened to repair.
#
# TWO DELIBERATE EXCLUSIONS, both intentional, neither an oversight:
#  (1) test_rls_isolation.py, test_citation_roundtrip.py and
#      test_citation_numbering.py need a REAL Postgres, so they
#      belong to cloudbuild.test-critical.yaml (and, for the
#      non-superuser DSN, cloudbuild.test-rls.yaml from plan 15.2-01).
#  (2) test_gate_replay.py, test_verification_buckets.py,
#      test_fail_loud.py, test_tribunal_grouping.py,
#      test_claim_distiller.py and test_stage_schema.py are ALREADY
#      run by cloudbuild.test-gates.yaml, which the 15.2 sampling
#      rate runs alongside this gate at every wave merge — listing
#      them twice would only slow the gate down.
#
# THE FIVE GAP-PHASE FILES (the last five entries below) WERE ADDED
# ALL AT ONCE BY PLAN 15.2-20, four of them before their files
# existed. Say the trap out loud, because this repository has a
# documented history of gates that were green because they ran
# nothing: the `ls … || true` idiom SILENTLY SKIPS a name whose file
# is absent, so between waves those four names collected as nothing
# and this gate stayed green having proven nothing about them. The
# arrangement was deliberate — one owner for this config, no plan
# left with an ungated test — and it was only honest if each part
# was done:
#   * each owning plan proved ITS OWN file was BOTH collected (read
#     the `collecting:` block) AND green;
#   * plan 15.2-26 RECONCILED the final collected count before the
#     phase closed, so a MISTYPED name cannot survive.
# THAT SECOND PART IS THE `EXPECTED_FILES` ASSERTION BELOW, and the
# arrangement is now closed. From here on a name in this list whose
# file is absent or mistyped is a RED BUILD, not a quiet skip.
#
# NEVER put an apostrophe anywhere in this block — not even inside a
# comment, and not to quote this rule. The whole script below is
# passed to bash as ONE single-quoted -c argument, so any single
# quote CLOSES that string and the remainder is reparsed by the outer
# shell. The symptom is bewildering: a bare
# "python: command not found" long AFTER pip has succeeded. Cost one
# red build on 2026-07-27.
#     15.2-20 -> test_stale_reclaim.py   (D-E stale reclaim)
#     15.2-21 -> test_brief_input.py
#     15.2-22 -> test_web_fetch_replay.py
#     15.2-23 -> test_dispatch_pii.py
#     15.2-24 -> test_stage_logging.py
#     15.3-01 -> test_run_events.py    (run_event emitter, D-06/D-07)
#     15.3-02 -> test_run_events_api.py (run_event READ surface)
#     15.3-03 -> test_run_event_emit.py (the EMIT SITES: dividers
#                carry labels, one dispatch header per batch, a
#                failed angle says why, and neither calling the
#                emitter nor BUILDING its arguments can fail a run)
#     15.4-02 -> test_source_resolution.py (alembic 0016: the two
#                nullable `source` columns D-V01-11 needs, the
#                0015 -> 0016 chain, and the proof that the
#                migration leaves idx_source_tenant_content_hash
#                alone. It also carries a NEGATIVE CONTROL that runs
#                the same scan over a deliberately bad migration, so
#                a green result here is not a scan that never bit.)
#
#     15.4-03 -> test_distiller_separators.py (the V-01 `<TAB>`
#                defect: the separator-priority table, the
#                PROMPT-CONTRACT GUARD, and the replay of the four
#                RECORDED V-01 distiller responses -- 141 + 137 =
#                278 recovered, 43 and 143 unchanged.)
#
#     15.5-01 -> test_claim_attribution.py (alembic 0017: the three
#                nullable `claim` columns D-R3 needs -- sub_question,
#                corroboration_key and as_of. It PROVES the
#                0016 -> 0017 chain and its single head, the
#                ADDITIVE-ONLY body as an ALLOWLIST read off the
#                UNPARSED source (a grep passes on a comment that
#                merely mentions a column name, and this migration
#                names all three in prose repeatedly), the ORM/DDL
#                agreement, and the `as_of` date grammar -- whose
#                REJECTIONS are asserted as hard as its acceptances,
#                because a wrong date turns a real contradiction into
#                a fake time series. It carries a NEGATIVE CONTROL,
#                test_the_scan_bites_on_a_deliberately_bad_migration,
#                so a green result here is not a scan that never bit.
#
#                WHAT IT CANNOT PROVE: that the migration RAN. That
#                proof is the literal deploy-log line
#                `Running upgrade 0016 -> 0017`, and phase 15.5
#                deploys NOTHING -- the whole engine redesign lands in
#                git and there is ONE deploy at the end of phase 15.8.
#                The proof is OWED THERE, alongside 0016 own still
#                unpaid `Running upgrade 0015 -> 0016`. Exit code 0 is
#                not a substitute.
#
#                It is PURE: it parses the migration with ast and
#                builds the Claim table metadata in memory, and
#                extract_as_of is a stdlib-only function over a
#                string. upgrade() is NEVER CALLED, so no DDL is
#                emitted and no Postgres is involved. It deliberately
#                carries NO RLS test -- a row-level POLICY is a
#                TABLE-level object so a new column is covered by
#                construction, and this gate provisions no database,
#                so a role-less DB test would run as SUPERUSER and
#                pass vacuously. The reasoning is written in the file
#                so nobody adds one later thinking it was forgotten.
#
# PHASE 15.6 (Wave 3 of the engine redesign) adds TWO files, and
# both names were registered by ONE plan -- 15.6-07 -- at the END of
# the phase rather than by their own wave-1 plans. That is a
# DELIBERATE inversion of the 15.3/15.4/15.5 rule that a plan
# registers its test file in the same commit that creates it, and the
# reason is the same rule those phases were honouring: this config has
# a SINGLE OWNER per phase. With one owner, the only way to also
# guarantee the `ls ... || true` silent-skip window never opens is to
# add the names AFTER both files exist. Registering them in wave 1
# would have named two absent files across three waves -- precisely
# the gap-phase trap described above. Both names and the 33 -> 35 bump
# landed in ONE edit.
#
#     15.6-01 -> test_question_grouping.py (D-R4 grouping core: the
#                GROUP RECORD, the HARD CEILING of 5 groups -- a
#                ceiling and not a target, so fewer is allowed and
#                there is no floor padding -- the TOTALITY of the
#                assignment (every winner lands in exactly one group,
#                none silently dropped), the DETERMINISTIC
#                one-group-per-client-question FALLBACK that replaces
#                the deleted top-k plus round-robin machinery and
#                records a D-12 degradation when it fires, and the
#                INDEX-ONLY tool schema -- the grouping LLM addresses
#                winners by index and never by text, so its output
#                cannot smuggle a rewritten question through to three
#                third-party providers.
#
#                It is PURE: every function under test is a pure
#                string/list transform, and the ONE async function is
#                driven through a hand-written duck-typed fake. No
#                Postgres, no provider key, no network.
#
#     15.6-02 -> test_discovery_bracket.py (D-W3-4 discovery bracket:
#                NO SOURCE NO SLOT -- a candidate without the quote and
#                source that provoked it is refused -- the GLOBAL POOL
#                with a PER-PARENT CAP of 3 rather than a per-question
#                quota, because a quota forces the system to MANUFACTURE
#                a discovery question to fill it, the ROLL-BACK of
#                unused slots to the MANDATE (more depth) and never
#                into more discovery, and the `__discovery__` SENTINEL
#                that marks a cross-cutting question the coverage
#                assertion must IGNORE, so the guard neither rejects it
#                nor silently counts it as covering a client question
#                it does not answer.
#
#                PURE for the same reasons as the file above.
#
# WHAT NEITHER FILE CAN PROVE, stated here so it is not mistaken for
# proven: phase 15.6 DEPLOYS NOTHING and RUNS NOTHING LIVE. Waves 2-5
# of the redesign land in git only, and there is ONE deploy and ONE
# measuring run at the end of phase 15.8. This phase adds NO
# migration, so it adds no third alembic proof -- but the two already
# owed, the literal lines `Running upgrade 0015 -> 0016` and
# `Running upgrade 0016 -> 0017`, remain UNPAID and are owed at 15.8.
#
# test_distiller_separators.py carries the ONLY assertion in the
# repo that pins the distiller prompt contract. The docstring at
# steps.py `_build_distiller_prompt` used to claim that
# test_claim_distiller.py and test_distiller_coverage.py pinned it
# BYTE-IDENTICALLY; that claim was FALSE (verified 2026-07-29 by
# reading both files -- one asserts nothing about the prompt, the
# other matches only the `### Provider:` header). So if this file
# is ever dropped from the list below, the `|||` contract goes
# UNGATED and nothing turns red when `<TAB>` comes back. It is PURE:
# `_split_distiller_line`, `_parse_distiller_response` and
# `_build_distiller_prompt` are pure string functions and the
# run_7dcf51d5 fixture is committed text read from disk. No GCS
# client is constructed at any point.
#
# test_source_resolution.py is PURE: it parses the 0016 migration
# with ast and builds the Source table metadata in memory. It never
# CALLS upgrade(), so no alembic migration context and no Postgres
# is involved -- which also means this gate CANNOT prove the
# migration ran. That proof is the deploy-time
# `Running upgrade 0015 -> 0016` line, owned by plan 15.4-11.
#
# test_run_event_emit.py is PURE for the same two reasons as the two
# files above it: the run_events Postgres seams are replaced by the
# suite, and its end-to-end behaviours drive the stubbed harness that
# test_engine_e2e_stubbed.py already installs. No Postgres, no key,
# no network.
#
# test_run_events.py is PURE: no Postgres, no provider key, no
# network. The two operations in runs/run_events.py that touch the
# database are module-level test seams the suite replaces with a
# recorder, so this gate RUNS that file rather than skipping it.
#
# test_run_events_api.py is PURE for a different reason: it drives
# GET /{run_id}/events through a hand-written duck-typed session that
# behaves like a tiny in-memory run_event table, so no Postgres is
# involved. It needs fastapi + httpx, and BOTH ARE PINNED in
# requirements.txt (0.136.3 / 0.28.1) which pip installs above -- so
# its importorskip guards cannot make it skip silently here. If that
# file ever reports as skipped in the -rs summary, the dependency
# pin moved and the isolation proofs are NOT running.
#
# test_stale_reclaim.py is DB-BOUND and therefore SKIPS in THIS gate,
# which provisions no Postgres. That is contract-compliant (see the
# header: a listed file may skip cleanly when DATABASE_URL is unset)
# and it is NOT a pass. What this gate proves for that file is that it
# imports, collects and does not error; the harness that RUNS it is
# cloudbuild.test-critical.yaml, whose DSN is a superuser on a
# disposable schema. Read the `-rs` skip summary, not the exit status.
# ---------------------------------------------------------------------------
# PHASE 15.8 (Wave 5 of the engine redesign) — THIS FILE HAS EXACTLY ONE OWNER
# THIS PHASE, AND THAT REVERSES THE RULE STATED FOUR TIMES ABOVE. Decision
# D-W5-5, with D-W5-5a, D-W5-12, D-W5-13, D-W5-15 and D-W5-4. Written by the
# owning plan, 15.8-13, in wave 4.
#
# 1. THE DEVIATION, STATED AS A REVERSAL AND NOT AS A FOOTNOTE. The 15.3 and
#    15.4 paragraphs above say: "the list and the number are one change, and
#    splitting them is how a gate goes green having run less than it claims."
#    PHASE 15.8 DID NOT FOLLOW THAT RULE. Eight wave-1 plans were BARRED from
#    touching this file. One plan — 15.8-13, in wave 4 — appended all seven new
#    paths and moved EXPECTED_FILES ONCE, from 36 to 43, derived from the real
#    file list on the merged tree rather than incremented from memory. This
#    paragraph exists so that a reader who finds the old rule and the new
#    behaviour is not reading two authorities that disagree: that shape is what
#    produced the D-DEF-01 inverted rationale comments (three comments citing a
#    defect to justify their own flattening) and the 15.6 CR-01 defect.
#
# 2. WHY. Eight wave-1 plans would each have bumped the same single
#    EXPECTED_FILES line — a guaranteed merge conflict, and worse, one that can
#    silently resolve to a WRONG NUMBER. It is also the trap of an exact-set
#    allowlist held over a file that a sibling plan also edits, which cost 15.5
#    a cross-plan regression that three green verifications and a passed
#    plan-check all missed.
#
# 3. THE COST THAT WAS ACCEPTED, stated plainly because it is the honest
#    weakness of the arrangement. Between wave 1 and wave 4 this repository
#    contained test files that were NOT in the list below, so THEY DID NOT RUN.
#    THE COUNT ASSERTION DOES NOT CATCH THAT: the list matched its own count;
#    the files were simply absent from it. On its first outing that window did
#    exactly what it was warned it could do — plan 15.8-02 created
#    test_pipeline_dispatch_clause.py and did not declare it, and it was caught
#    by the orchestrator tally (D-W5-13), not by this gate.
#
# 4. THE CONDITION THAT MAKES IT SAFE, written as a condition and not as a
#    reassurance: NO GATE RUNS BEFORE 15.8-13. That plan IS the phase gate.
#    IF ANY FUTURE PHASE ADOPTS SINGLE-OWNER OWNERSHIP OF THIS FILE AND ALSO
#    PROPOSES RUNNING THIS GATE MID-PHASE, THE ARRANGEMENT BREAKS AND MUST BE
#    REVISITED BEFORE THAT BUILD IS TRUSTED. Absent that condition, the default
#    remains the 15.3 / 15.4 rule above: path and count in ONE edit.
#
# 5. THE SCOPE FENCE (D-W5-5a). The single-owner deviation applies to THIS
#    CONFIG ONLY, and only for phase 15.8. cloudbuild.test-gates.yaml KEEPS THE
#    ORIGINAL ONE-EDIT RULE: a plan that adds a file there adds the path and the
#    count together, in one edit. A reader who generalises this deviation to
#    every CI config reproduces the two-authorities trap in a second place. That
#    file carries the matching sentence, written by plan 15.8-07.
#
# 6. WHAT A FLAT COUNT ON THE OTHER GATE MEANS (D-W5-12). STATE.md explains the
#    flat 15.6 gates count as a fixed set of 13 files, NONE OF WHICH 15.6
#    TOUCHED. THE SECOND HALF DOES NOT TRANSFER TO 15.8: MOST OF THE FILES THAT
#    CONFIG NAMES IMPORT THE TRIBUNAL PIPELINE MODULES THIS PHASE EDITS
#    (criterion: an import of pipeline.tribunal or of nestor_pulse_sdk.pipeline;
#    plans 15.8-02, 15.8-03, 15.8-09 and 15.8-10 all edit those modules). So an
#    UNCHANGED pass count there is a genuine REGRESSION PASS over wave-1 and
#    wave-2 edits — evidence, not insulation. AND A RED THERE IS A REAL SIGNAL
#    ABOUT THOSE EDITS, NOT A CONFIG TO TUNE. Per D-W5-15 no measured integer is
#    written here: the CRITERION is stated, and the number is measured at
#    execution time and recorded in the executing plan SUMMARY, where it is
#    dated and attributable instead of rotting in a comment that nobody
#    re-measures.
#
# THE TWO INVARIANTS THAT MAKE THIS FILE RECONCILABLE WITH ONE GREP, SAID OUT
# LOUD SO THE NEXT EDITOR DOES NOT BREAK THEM BY ACCIDENT:
#   * the package-qualified tests path prefix appears ONLY inside the WANTED
#     list. Comments name test files by BARE FILENAME (test_stale_reclaim.py),
#     never with that prefix — which is what makes counting the registered
#     paths a single grep over the whole file. Keep it that way.
#   * EXPECTED_FILES followed by an equals sign and digits appears EXACTLY ONCE
#     in this file. Comments discuss the variable BY NAME, never with a value.
#
# D-W5-4 — THE THREE UNGATED COMMITS THIS PHASE OWED. 8eff424, 868775b and
# 9f5a120 (operator rulings D-W4-9/10/11, 2026-08-04) were proved locally by
# source-text mutation and a real-module behaviour battery, but NO PYTEST RUN
# EXISTED for them. They added NO new test FILE, so they contribute ZERO to
# EXPECTED_FILES and exactly TEN to the passed count. The baseline they must
# beat: build 7c89be5c = 1538 passed / 0 failed / 13 skipped, at 36 of 36
# collected.
#
# HOW TO READ A RESULT FROM THIS GATE — three traps, each of which has already
# bitten this project:
#   * gcloud builds submit piped into tail returns the PIPE exit code, so a
#     FAILED build reports exit 0. Read the build TEXT instead:
#     gcloud builds describe BUILD_ID --format=value(status), plus
#     gcloud builds log BUILD_ID. NEVER a shell exit code.
#   * SUCCESS and FAILURE are results. QUEUED, WORKING, EXPIRED and CANCELLED
#     are NOT. An EXPIRED build is visually identical to a QUEUED one; one 15.7
#     run expired in the queue and was nearly read as pending.
#   * A count that did not rise must be EXPLAINED with a mechanism, not merely
#     noted. Read the -rs skip summary, not the exit status: a listed file that
#     skips cleanly is contract-compliant and IS NOT A PASS.
#
# THE SEVEN FILES PHASE 15.8 ADDED AND REGISTERED, all PURE (no Postgres, no
# provider key, no network), all appended at the END of the list so the diff
# stays readable and the pre-existing 36 keep their order:
#     15.8-02 -> test_pipeline_dispatch_clause.py
#     15.8-05 -> test_yield_schema.py, test_yield_records.py
#     15.8-09 -> test_pipeline_assignment_yield.py,
#                test_research_division_yield.py
#     15.8-10 -> test_workshop_round_yield.py
#     15.8-11 -> test_suite_hygiene.py
#
# ONE NON-REGISTRATION, NAMED RATHER THAN LEFT SILENT — an unnamed exclusion is
# the same silent skip this config exists to prevent. Plan 15.8-11 reviewed the
# suite and found a PRE-EXISTING file that is in NEITHER gate config:
# test_tribunal_pipeline.py. It carries an AST denylist over pipeline.py, a
# module that BOTH 15.8-02 and 15.8-09 edit this phase, so that guard currently
# protects nothing because nothing runs it. It was NOT registered here, and the
# reason is deliberate rather than an oversight: its trailing assertion on the
# name persist_tribunal_claims is a RAW-TEXT match over the unparsed file, so a
# comment or a string literal mentioning that name satisfies it vacuously.
# Registering it as-is would add a guard that can go green for the wrong reason,
# and could go red for the wrong reason too. TIGHTEN THAT ASSERTION TO AN AST
# CHECK FIRST, THEN ADD THE PATH AND BUMP THE COUNT IN THE SAME EDIT. Recorded
# by plan 15.8-13 as OWED, not as done.
# ---------------------------------------------------------------------------
# ONE list, read TWICE: `ls` collects from it and the assertion below
# reconciles against it. The names live in a variable rather than
# inline in the `ls` so the failure can NAME the path that went
# missing instead of printing a bare number at a tired operator.

steps:
  - id: pytest-engine
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        docker run --rm \
          -v /workspace:/workspace -w /workspace \
          python:3.11-slim bash -c '
            set -e
            pip install --no-cache-dir -q -r requirements.txt
            # The full rationale for this list — the two deliberate exclusions,
            # the gap-phase trap, and why EXPECTED_FILES must change with the
            # list — lives in the YAML comments above `steps:`. Moved there
            # 2026-07-29, verbatim, to fit the 10,000-char arg limit.
            #
            # NO APOSTROPHES ANYWHERE BELOW THIS LINE. Everything from
            # `bash -c ` to the closing quote is ONE single-quoted shell string,
            # so a single apostrophe in a COMMENT closes it early and the build
            # dies with exit 127 (command not found) — which is what happened
            # when this note was first written with the word "list" possessive.
            # The 131 lines that used to live here contained none, deliberately.
            WANTED="nestor_pulse_sdk/tests/test_reliability_retry.py \
                    nestor_pulse_sdk/tests/test_reliability_breaker.py \
                    nestor_pulse_sdk/tests/test_terminal_states.py \
                    nestor_pulse_sdk/tests/test_feed_enrichment.py \
                    nestor_pulse_sdk/tests/test_fact_list_parser.py \
                    nestor_pulse_sdk/tests/test_citation_anchors.py \
                    nestor_pulse_sdk/tests/test_report_sections.py \
                    nestor_pulse_sdk/tests/test_status_gates.py \
                    nestor_pulse_sdk/tests/test_coverage_reentry.py \
                    nestor_pulse_sdk/tests/test_workshop_critique.py \
                    nestor_pulse_sdk/tests/test_workshop_scope_guard.py \
                    nestor_pulse_sdk/tests/test_workshop_tournament.py \
                    nestor_pulse_sdk/tests/test_workshop_languages.py \
                    nestor_pulse_sdk/tests/test_own_researcher.py \
                    nestor_pulse_sdk/tests/test_cost_serpapi.py \
                    nestor_pulse_sdk/tests/test_factlist_fallback.py \
                    nestor_pulse_sdk/tests/test_checkpoint_resume.py \
                    nestor_pulse_sdk/tests/test_provider_resume.py \
                    nestor_pulse_sdk/tests/test_engine_e2e_stubbed.py \
                    nestor_pulse_sdk/tests/test_research_division_assignment.py \
                    nestor_pulse_sdk/tests/test_distiller_coverage.py \
                    nestor_pulse_sdk/tests/test_hash_chain_replay.py \
                    nestor_pulse_sdk/tests/test_stale_reclaim.py \
                    nestor_pulse_sdk/tests/test_brief_input.py \
                    nestor_pulse_sdk/tests/test_web_fetch_replay.py \
                    nestor_pulse_sdk/tests/test_dispatch_pii.py \
                    nestor_pulse_sdk/tests/test_stage_logging.py \
                    nestor_pulse_sdk/tests/test_run_events.py \
                    nestor_pulse_sdk/tests/test_run_events_api.py \
                    nestor_pulse_sdk/tests/test_run_event_emit.py \
                    nestor_pulse_sdk/tests/test_source_resolution.py \
                    nestor_pulse_sdk/tests/test_distiller_separators.py \
                    nestor_pulse_sdk/tests/test_claim_attribution.py \
                    nestor_pulse_sdk/tests/test_question_grouping.py \
                    nestor_pulse_sdk/tests/test_discovery_bracket.py \
                    nestor_pulse_sdk/tests/test_workshop_loop.py \
                    nestor_pulse_sdk/tests/test_pipeline_dispatch_clause.py \
                    nestor_pulse_sdk/tests/test_yield_schema.py \
                    nestor_pulse_sdk/tests/test_yield_records.py \
                    nestor_pulse_sdk/tests/test_pipeline_assignment_yield.py \
                    nestor_pulse_sdk/tests/test_research_division_yield.py \
                    nestor_pulse_sdk/tests/test_workshop_round_yield.py \
                    nestor_pulse_sdk/tests/test_suite_hygiene.py"
            # Change this number and the list above TOGETHER. It is not a
            # decoration: it is the whole difference between a gate and a green
            # tick. There is deliberately NO early `exit 0` for an empty
            # collection any more — an empty collection is the WORST case of the
            # false green, and it now fails here like every other shortfall.
            EXPECTED_FILES=43
            FILES=$$(ls $$WANTED 2>/dev/null || true)
            COLLECTED=$$(echo $$FILES | wc -w)
            if [ "$$COLLECTED" -ne "$$EXPECTED_FILES" ]; then
              echo "############################################################"
              echo "ENGINE GATE ASSERTION FAILED"
              echo "collected $$COLLECTED file(s); this config NAMES $$EXPECTED_FILES."
              echo ""
              echo "This is NOT a test failure and it is NOT a pass. It means the"
              echo "gate would have run LESS than it claims. A pytest summary"
              echo "printed after this point would describe only the files that"
              echo "happened to exist, and would say NOTHING about the ones below."
              echo ""
              echo "ABSENT OR MISTYPED:"
              for f in $$WANTED; do
                [ -f "$$f" ] || echo "    $$f"
              done
              echo ""
              echo "THE FULL EXPECTED LIST ($$EXPECTED_FILES paths):"
              for f in $$WANTED; do
                echo "    $$f"
              done
              echo ""
              echo "Fix the path, or add the file, or change BOTH the list and"
              echo "EXPECTED_FILES deliberately. Do not delete this check."
              echo "############################################################"
              exit 1
            fi
            echo "collecting: $$COLLECTED of $$EXPECTED_FILES expected files"
            echo "$$FILES"
            python -m pytest $$FILES -v -rs --tb=short -m "not live"
          '
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: "1800s"
