; Alembic config for the Nestor Pulse SDK pipeline.
;
; Per 01-RESEARCH.md § ORM and Schema-Push Recommendation (lines 995-1015),
; the canonical migration command is:
;
;     cd nestor_pulse_sdk && alembic upgrade head
;
; DATABASE_URL is read from os.environ inside env.py (populated either via
; nestor_pulse.secrets.load_secrets_into_env() locally or via Cloud Build
; --set-secrets in CI). It is NOT interpolated here -- we keep sqlalchemy.url
; empty so env.py is the single source of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
version_path_separator = os

; Empty by design -- env.py reads DATABASE_URL from os.environ.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
