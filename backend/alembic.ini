; Alembic config for the Nestor Intake (GCP re-platform) backend.
;
; Canonical migration command (from backend/):
;     cd backend && alembic upgrade head
;
; The test harness (tests/conftest.py) loads THIS file via
; ``Config(<backend>/alembic.ini)`` and sets ``sqlalchemy.url`` to the
; pgvector container DSN before ``command.upgrade(cfg, "head")``. env.py honors
; that pre-set url and only falls back to ``DATABASE_URL`` when it is empty.
;
; ``%(here)s`` expands to this file's directory, so ``script_location`` and
; ``prepend_sys_path`` resolve correctly no matter the cwd alembic runs from
; (the harness does not chdir into backend/).

[alembic]
script_location = %(here)s/app/db/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
version_path_separator = os

; Empty by design — env.py resolves the URL (harness-set or DATABASE_URL).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
