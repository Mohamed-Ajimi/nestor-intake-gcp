[project]
name = "nestor-intake-backend"
version = "0.1.0"
description = "Nestor Intake (GCP re-platform) — FastAPI on Cloud Run backend: schema, migrations, and the per-space RLS data layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic==1.18.4",
    "pgvector==0.4.2",
    "cloud-sql-python-connector[pg8000]==1.20.2",
    "pg8000>=1.31,<1.32",
    # Phase 2 runtime: FastAPI skeleton on Cloud Run (API-01) + typed env config.
    # NOTE: the Cloud SQL connector + pg8000 driver are already declared above — do NOT re-add them.
    "fastapi>=0.137",
    "uvicorn[standard]>=0.49",
    "pydantic-settings>=2.14",
    # Identity Platform server SDK: verify_id_token + set_custom_user_claims (AUTH-02/03).
    # Init uses ADC (no SA key in env — D-09); firebase_project_id is an explicit override only.
    "firebase-admin>=7.4,<8",
    # Secret Manager: get_superadmin_engine() reads the app_superadmin DB password
    # (Path B, D-05a) once at runtime. Imported LAZILY in app/db/base.py so the
    # testcontainers / DATABASE_URL path never loads it (Phase 4 / 04-02-PLAN).
    "google-cloud-secret-manager>=2.20,<3",
    # Phase 7 AI ports: official external-API SDKs for the four Claude skills,
    # OpenAI embeddings (text-embedding-3-small @ 1536) and Whisper transcription.
    # API KEYS are NOT declared here and NOT in core/config.Settings (D-07) — they
    # are read from os.environ at CALL TIME inside app/ai/clients.py factories only.
    # Versions verified on PyPI 2026-06-30 (07-RESEARCH § Standard Stack :83-84).
    "anthropic==0.113.0",
    "openai==2.44.0",
    # Phase 9 GCS storage (09-01, T-09-SC): both verified against PyPI at the
    # blocking-human legitimacy checkpoint — google-cloud-storage is the official
    # googleapis client (github.com/googleapis/python-storage); python-multipart
    # is the Kludex DISTRIBUTION (github.com/Kludex/python-multipart), NOT the
    # deprecated bare `multipart` package (do not add that one). google-auth
    # arrives transitively via google-cloud-storage — do NOT pin it separately.
    # NOTE: the live Cloud Run image does not have these until the 09-04 runbook
    # rebuild (Pitfall 7 — new deps are not in the running image).
    "google-cloud-storage>=3,<4",
    "python-multipart>=0.0.9",
    # Phase 10 notifications (10-01, NOTIF-01/02): Jinja2 HTML mail rendering with
    # autoescape (the email-context XSS guard T-10-01). Verified at the 10-01
    # blocking-human legitimacy checkpoint — Jinja2 is the Pallets project
    # (github.com/pallets/jinja), MIT-licensed, stable 3.x line, no typo-squat.
    "jinja2>=3.1,<4",
    # httpx is the SYNC Resend transport in app/mail/resend.py (POST to
    # api.resend.com). It was previously a dev-only dep (backs TestClient); it is
    # promoted to a RUNTIME dep here because the mail send path uses it in
    # production on Cloud Run. NOTE: the live image does not carry jinja2/httpx
    # until the Phase 10 image rebuild (new deps are not in the running image).
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgresql]",
    # httpx backs fastapi.testclient.TestClient — declared explicitly (do not rely on transitive).
    "httpx",
]

# uv groups (preferred for `uv sync`). Mirrors the [project.optional-dependencies] dev set.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgresql]",
    # httpx backs fastapi.testclient.TestClient — declared explicitly (do not rely on transitive).
    "httpx",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" so `async def test_*` functions run without an explicit
# @pytest.mark.asyncio on every test (pytest-asyncio). The RLS isolation harness
# uses async sessions, so auto mode keeps the suites terse.
asyncio_mode = "auto"
testpaths = ["tests"]
# Registered markers so `pytest --collect-only` runs WITHOUT "unknown marker" warnings.
# `integration` gates the live-DB / testcontainers suites (schema shape + RLS isolation).
# NOTE: deliberately NO watch-mode flag (no -f / --looponfail / pytest-watch). Wave 0 runs
# once per task commit; watch mode is banned by the validation contract.
markers = [
    "integration: tests that require a live Postgres (testcontainers pgvector/pgvector:pg16 or DATABASE_URL). Skipped cleanly when neither is available.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Backend application package lands here in Phase 2 (app/db/...); declare it now so the
# build backend resolves even before the package directory is populated.
packages = ["app"]
